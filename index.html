<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A static GitHub Pages explorer for the Kevin project file and folder structure."
    >
    <title>Kevin Repo Map</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#overview" data-route="overview" aria-label="Kevin Repo Map">
          <span class="brand-mark">KM</span>
          <span class="brand-text">Kevin Map</span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="app-nav">
          <span class="nav-toggle-line"></span>
          <span class="nav-toggle-line"></span>
          <span class="nav-toggle-line"></span>
          <span class="sr-only">Toggle navigation</span>
        </button>

        <nav id="app-nav" class="app-nav">
          <button class="nav-item is-active" type="button" data-view="overview">Overview</button>
          <button class="nav-item" type="button" data-view="explorer">Explorer</button>
          <button class="nav-item" type="button" data-view="worlds">Worlds</button>
          <button class="nav-item" type="button" data-view="assets">Assets</button>
          <button class="nav-item" type="button" data-view="code">Code</button>
          <button class="nav-item" type="button" data-view="docs">Docs</button>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="topbar-content">
            <p id="view-title" class="eyebrow">Overview</p>
            <label class="global-search">
              <span class="sr-only">Search paths</span>
              <input id="global-search" type="search" placeholder="Search files and folders">
            </label>
          </div>
        </header>

        <section id="overview" class="view is-active" aria-labelledby="overview-heading">
          <h1 id="overview-heading" class="sr-only">Overview</h1>
          <div id="overview-content"></div>
        </section>

        <section id="explorer" class="view" aria-labelledby="explorer-heading">
          <h1 id="explorer-heading" class="sr-only">Explorer</h1>
          <div id="explorer-content"></div>
        </section>

        <section id="worlds" class="view" aria-labelledby="worlds-heading">
          <h1 id="worlds-heading" class="sr-only">Worlds</h1>
          <div id="worlds-content"></div>
        </section>

        <section id="assets" class="view" aria-labelledby="assets-heading">
          <h1 id="assets-heading" class="sr-only">Assets</h1>
          <div id="assets-content"></div>
        </section>

        <section id="code" class="view" aria-labelledby="code-heading">
          <h1 id="code-heading" class="sr-only">Code</h1>
          <div id="code-content"></div>
        </section>

        <section id="docs" class="view" aria-labelledby="docs-heading">
          <h1 id="docs-heading" class="sr-only">Docs</h1>
          <div id="docs-content"></div>
        </section>
      </main>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
