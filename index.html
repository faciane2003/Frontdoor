<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A static GitHub Pages operations portal with knowledge base, JQS, SOPs, certs, schedule, and links."
    >
    <title>SOC Knowledge Portal</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary">
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="app-nav">
          <span class="nav-toggle-line"></span>
          <span class="nav-toggle-line"></span>
          <span class="nav-toggle-line"></span>
          <span class="sr-only">Toggle navigation</span>
        </button>

        <!-- Primary navigation keys intentionally match section IDs and URL hashes. -->
        <nav id="app-nav" class="app-nav">
          <button class="nav-item" type="button" data-view="dashboard">Dashboard</button>
          <button class="nav-item" type="button" data-view="sops">SOPs</button>
          <button class="nav-item" type="button" data-view="links">Links</button>
          <button class="nav-item" type="button" data-view="certs">Certs</button>
          <button class="nav-item" type="button" data-view="training">JQS</button>
          <button class="nav-item" type="button" data-view="schedule">On-Call</button>
          <button class="nav-item" type="button" data-view="github">GitHub</button>
          <button class="nav-item" type="button" data-view="tools">Tools</button>
          <button class="nav-item" type="button" data-view="cons">CONs</button>
          <button class="nav-item" type="button" data-view="soc">SOC Reference</button>
        </nav>

      </aside>

      <!-- Views are rendered lazily by js/main.js when their navigation item opens. -->
      <main class="workspace">
        <header class="topbar">
          <div class="topbar-content">
            <label class="global-search">
              <span class="sr-only">Search portal</span>
              <input id="global-search" type="search" placeholder="Search">
            </label>
          </div>
        </header>

        <section id="dashboard" class="view is-active" aria-labelledby="dashboard-heading">
          <h2 id="dashboard-heading" class="sr-only">Dashboard</h2>
          <div id="dashboard-grid" class="dashboard-overview"></div>
        </section>

        <section id="knowledge" class="view" aria-labelledby="knowledge-heading">
          <h2 id="knowledge-heading" class="sr-only">Knowledge Base</h2>
          <div id="knowledge-list" class="knowledge-list"></div>
        </section>

        <section id="training" class="view" aria-labelledby="training-heading">
          <h2 id="training-heading" class="sr-only">JQS</h2>
          <div id="training-list"></div>
        </section>

        <section id="sops" class="view" aria-labelledby="sops-heading">
          <h2 id="sops-heading" class="sr-only">SOPs</h2>
          <div id="sops-list"></div>
        </section>

        <section id="certs" class="view" aria-labelledby="certs-heading">
          <h2 id="certs-heading" class="sr-only">Certs</h2>
          <div id="certs-list"></div>
        </section>

        <section id="schedule" class="view" aria-labelledby="schedule-heading">
          <h2 id="schedule-heading" class="sr-only">On-Call</h2>
          <div id="schedule-list"></div>
        </section>

        <section id="links" class="view" aria-labelledby="links-heading">
          <h2 id="links-heading" class="sr-only">Links</h2>
          <div id="links-list"></div>
        </section>

        <section id="github" class="view" aria-labelledby="github-heading">
          <h2 id="github-heading" class="sr-only">GitHub</h2>
          <div id="github-list"></div>
        </section>

        <section id="tools" class="view" aria-labelledby="tools-heading">
          <h2 id="tools-heading" class="sr-only">Tools</h2>
          <div id="tools-list"></div>
        </section>

        <section id="cons" class="view" aria-labelledby="cons-heading">
          <h2 id="cons-heading" class="sr-only">Upcoming Cybersecurity Conferences</h2>
          <div id="cons-list"></div>
        </section>

        <section id="soc" class="view soc-view" aria-labelledby="soc-heading">
          <h2 id="soc-heading" class="sr-only">SOC Reference</h2>
          <iframe class="soc-frame" src="SOC/index.html" title="SOC cybersecurity reference"></iframe>
        </section>

      </main>
    </div>

    <!-- One schema-driven form handles new rows for every editable table. -->
    <dialog id="table-row-dialog" class="entry-dialog" aria-labelledby="entry-dialog-title">
      <form id="table-row-form">
        <div class="entry-dialog-header">
          <h2 id="entry-dialog-title">Add Row</h2>
        </div>
        <div id="table-row-fields" class="entry-form-fields"></div>
        <div class="entry-dialog-actions">
          <button type="button" class="entry-cancel" data-entry-cancel>Cancel</button>
          <button type="submit" class="entry-save">Save</button>
        </div>
      </form>
    </dialog>

    <!-- This non-modal dialog is positioned beside the map pin that opened it. -->
    <dialog id="conference-dialog" class="conference-dialog" aria-labelledby="conference-dialog-title">
      <div class="conference-dialog-header">
        <h2 id="conference-dialog-title">Conference Details</h2>
        <button type="button" class="conference-dialog-close" data-conference-close aria-label="Close conference details">Close</button>
      </div>
      <div id="conference-dialog-content" class="conference-dialog-content"></div>
    </dialog>

    <dialog id="intune-entry-dialog" class="entry-dialog" aria-labelledby="intune-entry-dialog-title">
      <form id="intune-entry-form">
        <div class="entry-dialog-header"><h2 id="intune-entry-dialog-title">Add Intune Item</h2></div>
        <div class="entry-form-fields">
          <label class="entry-field-wide" for="intune-entry-value"><span>Item</span><input id="intune-entry-value" name="value" type="text" required></label>
        </div>
        <div class="entry-dialog-actions">
          <button type="button" class="entry-cancel" data-intune-entry-cancel>Cancel</button>
          <button type="submit" class="entry-save">Save</button>
        </div>
      </form>
    </dialog>

    <script async src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
