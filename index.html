<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A static GitHub Pages operations portal with knowledge base, JQS, SOPs, certs, schedule, and links."
    >
    <title>SOC Knowledge Portal</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary">
        <a class="brand" href="#dashboard" data-route="dashboard" aria-label="SOC Knowledge Portal">
          <span class="brand-mark">HUD</span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="app-nav">
          <span class="nav-toggle-line"></span>
          <span class="nav-toggle-line"></span>
          <span class="nav-toggle-line"></span>
          <span class="sr-only">Toggle navigation</span>
        </button>

        <nav id="app-nav" class="app-nav">
          <button class="nav-item is-active" type="button" data-view="dashboard">Dashboard</button>
          <button class="nav-item" type="button" data-view="training">JQS</button>
          <button class="nav-item" type="button" data-view="sops">SOPs</button>
          <button class="nav-item" type="button" data-view="certs">Certs</button>
          <button class="nav-item" type="button" data-view="links">Links</button>
          <button class="nav-item" type="button" data-view="schedule">On-Call</button>
        </nav>

      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="topbar-content">
            <p id="view-title" class="eyebrow">SOC HUD</p>
            <label class="global-search">
              <span class="sr-only">Search portal</span>
              <input id="global-search" type="search" placeholder="Search">
            </label>
          </div>
        </header>

        <section id="dashboard" class="view is-active" aria-labelledby="dashboard-heading">
          <h2 id="dashboard-heading" class="sr-only">Dashboard</h2>
          <div id="dashboard-grid" class="hud-grid"></div>
        </section>

        <section id="knowledge" class="view" aria-labelledby="knowledge-heading">
          <h2 id="knowledge-heading" class="sr-only">Knowledge Base</h2>
          <div id="knowledge-list" class="knowledge-list"></div>
        </section>

        <section id="training" class="view" aria-labelledby="training-heading">
          <h2 id="training-heading" class="sr-only">JQS</h2>
          <div id="training-list"></div>
        </section>

        <section id="sops" class="view" aria-labelledby="sops-heading">
          <h2 id="sops-heading" class="sr-only">SOPs</h2>
          <div id="sops-list"></div>
        </section>

        <section id="certs" class="view" aria-labelledby="certs-heading">
          <h2 id="certs-heading" class="sr-only">Certs</h2>
          <div id="certs-list"></div>
        </section>

        <section id="schedule" class="view" aria-labelledby="schedule-heading">
          <h2 id="schedule-heading" class="sr-only">On-Call</h2>
          <div id="schedule-list"></div>
        </section>

        <section id="links" class="view" aria-labelledby="links-heading">
          <h2 id="links-heading" class="sr-only">Links</h2>
          <div id="links-list"></div>
        </section>

      </main>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
